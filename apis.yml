name: BillGuard
description: 'BillGuard was a consumer personal-finance and transaction-security company whose mobile app
  scanned bank and credit-card transactions for hidden fees, billing errors, grey charges, and fraud, and
  let users flag or dispute suspicious charges. Surfaced as a portfolio company of bessemer-venture-partners
  and added to the API Evangelist network for enrichment. The company was acquired by Prosper Marketplace
  in 2015 and folded into the Prosper Daily app; billguard.com now 301-redirects to prosper.com and no
  independent BillGuard developer, API, or documentation surface remains. This profile is retained as a
  historical portfolio lead with no live API artifacts to harvest.'
